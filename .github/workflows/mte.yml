name: AGF v8.0 MAX - MTE Validation
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  mte-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run MTE Runner T01-T20
        run: python src/mte_runner.py data/test_cases.yaml
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: mte-evidence
          path: |
            examples/mte_output.json
            evidence/
