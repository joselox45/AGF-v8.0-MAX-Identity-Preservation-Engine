<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AGF v12.4.5.7 - Forensic Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0e12; color: #e0e6ed; font-family: 'JetBrains Mono', monospace; }
        .panel { background-color: #141a21; border: 1px solid #1f2a36; }
        .btn-audit { background-color: #00ff88; color: #000; }
        .btn-audit:disabled { background-color: #1f2a36; color: #7a8696; cursor: not-allowed; }
        .btn-auto { background-color: #ffcc00; color: #000; }
        .btn-skin { background-color: #00d4ff; color: #000; }
        .verdict-PASS { color: #00ff88; border-color: #00ff88; background: rgba(0,255,136,0.1); }
        .verdict-HUMAN_REVIEW { color: #ffcc00; border-color: #ffcc00; background: rgba(255,204,0,0.1); }
        .verdict-BLOCKED { color: #ff3344; border-color: #ff3344; background: rgba(255,51,68,0.1); }
        
        .image-wrapper { position: relative; width: 100%; aspect-ratio: 4 / 5; background-color: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid #1f2a36; cursor: crosshair; }
        .image-wrapper img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }

        .crop-box { position: absolute; border: 2px dashed #00ff88; background: rgba(0, 255, 136, 0.15); cursor: move; box-sizing: border-box; display: none; touch-action: none; z-index: 10; }
        .resize-handle { position: absolute; right: -10px; bottom: -10px; width: 24px; height: 24px; background: #00ff88; border: 2px solid #000; border-radius: 50%; cursor: se-resize; touch-action: none; z-index: 11; }
        .crop-cross { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; pointer-events: none; }
        .crop-cross::before, .crop-cross::after { content: ''; position: absolute; background: rgba(0,255,136,0.5); }
        .crop-cross::before { top: 9px; left: 0; width: 20px; height: 2px; }
        .crop-cross::after { left: 9px; top: 0; width: 2px; height: 20px; }
        
        .eye-point { position: absolute; width: 10px; height: 10px; background: #ffcc00; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 50; }
        
        .metric-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #1f2a36; }
        .metric-label { color: #7a8696; font-size: 11px; }
        .metric-value { font-weight: bold; font-size: 12px; }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center">
    <div class="w-full max-w-md pb-10">
        <!-- Header -->
        <div class="text-center mb-4 border-b border-gray-700 pb-3">
            <h1 class="text-xl font-bold text-[#00ff88]">AGF v12.4.5.7 - FORENSIC</h1>
            <p class="text-[10px] text-gray-400 mt-1">Servidor Forense Conectado (ONNX Real)</p>
        </div>

        <!-- Auto Helpers -->
        <div class="flex flex-col gap-2 mb-4">
            <button id="btn-auto" class="btn-auto w-full py-2 font-bold text-xs tracking-widest rounded" disabled onclick="startEyeAlignment()">
                👁️ AUTO-ALINEAR POR OJOS
            </button>
            <button id="btn-skin" class="btn-skin w-full py-2 font-bold text-xs tracking-widest rounded" disabled onclick="autoSkinFocus()">
                🧴 AUTO-DETECTAR PIEL
            </button>
        </div>

        <!-- Uploads -->
        <div class="flex flex-col gap-4 mb-4">
            <div class="panel p-3">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-[11px] text-gray-400">01 // FOTO ORIGINAL</h2>
                    <button onclick="document.getElementById('file1').click()" class="text-[9px] bg-gray-700 px-2 py-1 rounded text-white">SUBIR</button>
                </div>
                <input type="file" id="file1" accept="image/*" class="hidden" onchange="loadImage(this, 1)">
                <div class="image-wrapper" id="wrapper1">
                    <img id="preview1">
                    <div class="crop-box" id="box1"><div class="crop-cross"></div><div class="resize-handle" id="handle1"></div></div>
                </div>
            </div>

            <div class="panel p-3">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-[11px] text-gray-400">02 // FOTO GENERADA</h2>
                    <button onclick="document.getElementById('file2').click()" class="text-[9px] bg-gray-700 px-2 py-1 rounded text-white">SUBIR</button>
                </div>
                <input type="file" id="file2" accept="image/*" class="hidden" onchange="loadImage(this, 2)">
                <div class="image-wrapper" id="wrapper2">
                    <img id="preview2">
                    <div class="crop-box" id="box2"><div class="crop-cross"></div><div class="resize-handle" id="handle2"></div></div>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex flex-col gap-3 mb-4">
            <select id="mode" class="panel px-4 py-3 text-sm text-white w-full">
                <option value="preservation">PRESERVATION (Estricto)</option>
                <option value="restoration">RESTORATION (Tolerante)</option>
            </select>
            <button id="btn-audit" class="btn-audit w-full py-4 font-bold text-sm tracking-widest" disabled onclick="runAudit()">▶ AUDITORÍA FORENSE</button>
        </div>

        <!-- Results: 6 Layers -->
        <div id="results" class="panel p-4 mb-4 hidden">
            <h3 class="text-[11px] text-[#00ff88] mb-2 tracking-widest">=== AGF FORENSIC AUDIT ===</h3>
            <div class="metric-row"><span class="metric-label">[1] Identidad (ArcFace)</span><span id="res-cos" class="metric-value">-</span></div>
            <div class="metric-row"><span class="metric-label">[2] Firma (Fourier)</span><span id="res-fourier" class="metric-value">-</span></div>
            <div class="metric-row"><span class="metric-label">[3] Estructura (Shazam)</span><span id="res-shazam" class="metric-value">-</span></div>
            <div class="metric-row"><span class="metric-label">[4] Píxeles (SSIM)</span><span id="res-ssim" class="metric-value">-</span></div>
            <div class="metric-row"><span class="metric-label">[5] Color (HSV)</span><span id="res-color" class="metric-value">-</span></div>
                        <div id="res-verdict" class="text-center text-xl font-bold p-3 border mt-3">ESPERANDO...</div>
        </div>

        <!-- Log & JSON -->
        <div class="flex flex-col gap-4">
            <div class="panel p-3"><h3 class="text-[10px] text-gray-400 mb-2">CONSOLA</h3><div id="log" class="bg-black text-[10px] text-green-400 p-2 h-24 overflow-y-auto font-mono"></div></div>
            <div class="panel p-3">
                <div class="flex justify-between items-center mb-2"><h3 class="text-[10px] text-gray-400">EVIDENCIA JSON</h3><button onclick="downloadJSON()" class="bg-[#00ff88] text-black text-[9px] font-bold px-2 py-1 rounded">DESCARGAR</button></div>
                <pre id="json-box" class="bg-black text-[9px] text-gray-400 p-2 h-24 overflow-y-auto font-mono">// Esperando...</pre>
            </div>
        </div>
    </div>

    <script>
        let img1 = null, img2 = null;
        let lastResult = null;
        let activeBox = null, isDragging = false, isResizing = false;
        let startX, startY, startLeft, startTop, startWidth, startHeight;
        let isAligning = false, alignStep = 0;
        let alignCoords = { 1: [], 2: [] };

        function log(msg) {
            const el = document.getElementById('log');
            el.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            el.scrollTop = el.scrollHeight;
        }

        function loadImage(input, num) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    document.getElementById('preview' + num).src = e.target.result;
                    const box = document.getElementById('box' + num);
                    box.style.display = 'block';
                    box.style.left = '25%'; box.style.top = '25%';
                    box.style.width = '50%'; box.style.height = '50%';
                    if (num === 1) img1 = img; else img2 = img;
                    if (img1 && img2) {
                        document.getElementById('btn-audit').disabled = false;
                        document.getElementById('btn-auto').disabled = false;
                        document.getElementById('btn-skin').disabled = false;
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Mapeo exacto (para recorte real)
        function getImageBounds(img, wrapper) {
            const wrapperRect = wrapper.getBoundingClientRect();
            const imgAspect = img.width / img.height;
            const wrapperAspect = wrapperRect.width / wrapperRect.height;
            let drawnWidth, drawnHeight, offsetX, offsetY;
            if (imgAspect > wrapperAspect) {
                drawnWidth = wrapperRect.width;
                drawnHeight = wrapperRect.width / imgAspect;
                offsetX = 0; offsetY = (wrapperRect.height - drawnHeight) / 2;
            } else {
                drawnHeight = wrapperRect.height;
                drawnWidth = wrapperRect.height * imgAspect;
                offsetY = 0; offsetX = (wrapperRect.width - drawnWidth) / 2;
            }
            return { offsetX, offsetY, drawnWidth, drawnHeight, wrapperWidth: wrapperRect.width, wrapperHeight: wrapperRect.height };
        }

        function getCroppedCanvas(img, boxElement, wrapperElement, size = 112) {
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            const bounds = getImageBounds(img, wrapperElement);
            const pLeft = parseFloat(boxElement.style.left) / 100;
            const pTop = parseFloat(boxElement.style.top) / 100;
            const pWidth = parseFloat(boxElement.style.width) / 100;
            const pHeight = parseFloat(boxElement.style.height) / 100;
            const boxLeftPx = pLeft * bounds.wrapperWidth;
            const boxTopPx = pTop * bounds.wrapperHeight;
            const boxWidthPx = pWidth * bounds.wrapperWidth;
            const boxHeightPx = pHeight * bounds.wrapperHeight;
            const imgLeftPx = boxLeftPx - bounds.offsetX;
            const imgTopPx = boxTopPx - bounds.offsetY;
            const scaleX = img.width / bounds.drawnWidth;
            const scaleY = img.height / bounds.drawnHeight;
            let sx = Math.max(0, imgLeftPx * scaleX);
            let sy = Math.max(0, imgTopPx * scaleY);
            let sWidth = boxWidthPx * scaleX;
            let sHeight = boxHeightPx * scaleY;
            if (sx + sWidth > img.width) sWidth = img.width - sx;
            if (sy + sHeight > img.height) sHeight = img.height - sy;
            if (sWidth > 0 && sHeight > 0) {
                ctx.drawImage(img, sx, sy, sWidth, sHeight, 0, 0, size, size);
            }
            return canvas;
        }

        // Eye alignment
        function startEyeAlignment() {
            isAligning = true; alignStep = 0; alignCoords = { 1: [], 2: [] };
            log("👁️ Toca el OJO IZQUIERDO en FOTO ORIGINAL.");
            document.getElementById('wrapper1').style.border = "2px solid #ffcc00";
        }

        function handleEyeClick(e, num) {
            if (!isAligning) return;
            const wrapper = document.getElementById('wrapper' + num);
            const rect = wrapper.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;
            const dot = document.createElement('div');
            dot.className = 'eye-point'; dot.style.left = x + '%'; dot.style.top = y + '%';
            wrapper.appendChild(dot);
            alignCoords[num].push({ x, y });
            if (num === 1) {
                if (alignCoords[1].length === 1) log("👁️ Toca el OJO DERECHO en FOTO ORIGINAL.");
                else if (alignCoords[1].length === 2) {
                    log("✅ Original listo. Ahora OJO IZQUIERDO en FOTO GENERADA.");
                    document.getElementById('wrapper1').style.border = "1px solid #1f2a36";
                    document.getElementById('wrapper2').style.border = "2px solid #ffcc00";
                    isAligning = false;
                    setTimeout(() => { isAligning = true; alignStep = 1; window.scrollTo(0, document.getElementById('wrapper2').offsetTop - 50); }, 500);
                }
            } else if (num === 2 && alignStep === 1) {
                if (alignCoords[2].length === 1) log("👁️ Toca el OJO DERECHO en FOTO GENERADA.");
                else if (alignCoords[2].length === 2) {
                    log("✅ Generada lista. Calculando caja...");
                    document.getElementById('wrapper2').style.border = "1px solid #1f2a36";
                    isAligning = false;
                    calculatePerfectBoxes();
                }
            }
        }

        function calculatePerfectBoxes() {
            [1, 2].forEach(num => {
                const pts = alignCoords[num];
                if (pts.length < 2) return;
                const cx = (pts[0].x + pts[1].x) / 2;
                const cy = (pts[0].y + pts[1].y) / 2;
                const dist = Math.sqrt(Math.pow(pts[1].x - pts[0].x, 2) + Math.pow(pts[1].y - pts[0].y, 2));
                const boxSize = dist * 3.0;
                const box = document.getElementById('box' + num);
                box.style.width = boxSize + '%'; box.style.height = boxSize + '%';
                box.style.left = (cx - boxSize/2) + '%'; box.style.top = (cy - boxSize/2) + '%';
                document.querySelectorAll('#wrapper' + num + ' .eye-point').forEach(el => el.remove());
            });
            log("✨ Cajas alineadas. Usa el botón Azul para ajustar a la piel.");
        }

        // Skin detection
        function autoSkinFocus() {
            log("🧴 Analizando tonos de piel...");
            [1, 2].forEach(num => {
                const img = num === 1 ? img1 : img2;
                const box = document.getElementById('box' + num);
                const wrapper = document.getElementById('wrapper' + num);
                const canvas = getCroppedCanvas(img, box, wrapper, 128);
                const ctx = canvas.getContext('2d');
                const data = ctx.getImageData(0, 0, 128, 128).data;
                let minX = 128, minY = 128, maxX = 0, maxY = 0;
                let skinPixels = 0;
                for (let y = 0; y < 128; y++) {
                    for (let x = 0; x < 128; x++) {
                        const i = (y * 128 + x) * 4;
                        const r = data[i], g = data[i+1], b = data[i+2];
                        const cb = -0.168736 * r - 0.331264 * g + 0.5 * b + 128;
                        const cr = 0.5 * r - 0.418688 * g - 0.081312 * b + 128;
                        if (cb >= 77 && cb <= 127 && cr >= 133 && cr <= 173) {
                            skinPixels++;
                            if (x < minX) minX = x;
                            if (x > maxX) maxX = x;
                            if (y < minY) minY = y;
                            if (y > maxY) maxY = y;
                        }
                    }
                }
                if (skinPixels > 100) {
                    const pLeft = parseFloat(box.style.left);
                    const pTop = parseFloat(box.style.top);
                    const pWidth = parseFloat(box.style.width);
                    const pHeight = parseFloat(box.style.height);
                    const skinLeft = pLeft + (minX / 128) * pWidth;
                    const skinTop = pTop + (minY / 128) * pHeight;
                    const skinWidth = ((maxX - minX) / 128) * pWidth;
                    const skinHeight = ((maxY - minY) / 128) * pHeight;
                    box.style.left = skinLeft + '%';
                    box.style.top = skinTop + '%';
                    box.style.width = (skinWidth * 1.1) + '%';
                    box.style.height = (skinHeight * 1.1) + '%';
                    log(`✅ Foto ${num}: Piel detectada.`);
                }
            });
        }

        // Drag & Resize
        function initDragResize() {
            ['1', '2'].forEach(num => {
                const box = document.getElementById('box' + num);
                const handle = document.getElementById('handle' + num);
                const wrapper = document.getElementById('wrapper' + num);
                wrapper.addEventListener('pointerdown', (e) => { if (isAligning) handleEyeClick(e, num); });
                box.addEventListener('pointerdown', (e) => {
                    if (isAligning || e.target === handle) return;
                    isDragging = true; activeBox = box;
                    startX = e.clientX; startY = e.clientY;
                    startLeft = parseFloat(box.style.left); startTop = parseFloat(box.style.top);
                    box.setPointerCapture(e.pointerId);
                });
                handle.addEventListener('pointerdown', (e) => {
                    if (isAligning) return;
                    isResizing = true; activeBox = box;
                    startX = e.clientX; startY = e.clientY;
                    startWidth = parseFloat(box.style.width); startHeight = parseFloat(box.style.height);
                    handle.setPointerCapture(e.pointerId); e.stopPropagation();
                });
                box.addEventListener('pointermove', (e) => {
                    if (!isDragging && !isResizing) return;
                    const rect = wrapper.getBoundingClientRect();
                    const dx = ((e.clientX - startX) / rect.width) * 100;
                    const dy = ((e.clientY - startY) / rect.height) * 100;
                    if (isDragging) {
                        box.style.left = Math.max(0, Math.min(startLeft + dx, 100 - parseFloat(box.style.width))) + '%';
                        box.style.top = Math.max(0, Math.min(startTop + dy, 100 - parseFloat(box.style.height))) + '%';
                    } else if (isResizing) {
                        box.style.width = Math.max(10, Math.min(startWidth + dx, 100 - parseFloat(box.style.left))) + '%';
                        box.style.height = Math.max(10, Math.min(startHeight + dy, 100 - parseFloat(box.style.top))) + '%';
                    }
                });
                box.addEventListener('pointerup', (e) => {
                    isDragging = false; isResizing = false; activeBox = null;
                    box.releasePointerCapture(e.pointerId);
                });
            });
        }

        // SSIM simplificado
        function calculateSSIM(canvasA, canvasB) {
            const size = 112;
            const dataA = canvasA.getContext('2d').getImageData(0, 0, size, size).data;
            const dataB = canvasB.getContext('2d').getImageData(0, 0, size, size).data;
            let sumA = 0, sumB = 0;
            for(let i=0; i<dataA.length; i+=4) { sumA += dataA[i]; sumB += dataB[i]; }
            const muA = sumA / (size*size), muB = sumB / (size*size);
            let varA = 0, varB = 0, cov = 0;
            for(let i=0; i<dataA.length; i+=4) {
                const diffA = dataA[i] - muA, diffB = dataB[i] - muB;
                varA += diffA * diffA; varB += diffB * diffB; cov += diffA * diffB;
            }
            varA /= (size*size); varB /= (size*size); cov /= (size*size);
            const C1 = 6.5025, C2 = 58.5225;
            return ((2*muA*muB + C1) * (2*cov + C2)) / ((muA*muA + muB*muB + C1) * (varA + varB + C2));
        }

        // Cálculo de Laplaciano (Flatness) en Canvas
        function calculateFlatness(canvas) {
            const size = 112;
            const data = canvas.getContext('2d').getImageData(0, 0, size, size).data;
            const gray = new Float32Array(size * size);
            for (let i = 0; i < size * size; i++) {
                gray[i] = 0.299 * data[i*4] + 0.587 * data[i*4+1] + 0.114 * data[i*4+2];
            }
            let laplacian = new Float32Array(size * size);
            for (let y = 1; y < size-1; y++) {
                for (let x = 1; x < size-1; x++) {
                    const idx = y*size + x;
                    laplacian[idx] = Math.abs(4*gray[idx] - gray[idx-1] - gray[idx+1] - gray[idx-size] - gray[idx+size]);
                }
            }
            let sum = 0, sqSum = 0;
            for (let i = 0; i < laplacian.length; i++) {
                sum += laplacian[i]; sqSum += laplacian[i] * laplacian[i];
            }
            const mean = sum / laplacian.length;
            return (sqSum / laplacian.length) - (mean * mean);
        }

        async function runAudit() {
            const btn = document.getElementById('btn-audit');
            btn.disabled = true; btn.innerText = "ENVIANDO A TERMUX...";
            document.getElementById('results').classList.remove('hidden');
            document.getElementById('log').innerHTML = "";
            
            const mode = document.getElementById('mode').value;
            log(`Conectando con el motor forense en Termux (${mode.toUpperCase()})...`);
            
            try {
                // 1. Convertir las imágenes recortadas a Blob para enviarlas por POST
                const canvas1 = getCroppedCanvas(img1, document.getElementById('box1'), document.getElementById('wrapper1'), 512);
                const canvas2 = getCroppedCanvas(img2, document.getElementById('box2'), document.getElementById('wrapper2'), 512);
                
                const blob1 = await new Promise(resolve => canvas1.toBlob(resolve, 'image/jpeg', 0.95));
                const blob2 = await new Promise(resolve => canvas2.toBlob(resolve, 'image/jpeg', 0.95));
                
                // 2. Preparar el FormData para la API de Flask
                const formData = new FormData();
                formData.append('original', blob1, 'original.jpg');
                formData.append('generated', blob2, 'generated.jpg');
                formData.append('mode', mode);
                
                log("Imágenes enviadas. Calculando ArcFace, Fourier y SSIM en el servidor...");
                
                // 3. Hacer la petición al Backend (Flask)
                // NOTA: Asegúrate de que Flask está corriendo en la misma red
                const apiUrl = `http://${window.location.hostname}:8000/api/v1/verify`;
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) throw new Error("Error en el servidor");
                
                const data = await response.json();
                
                // 4. Actualizar UI (Soporte para BLOCKED sin métricas)
                const vEl = document.getElementById('res-verdict');
                vEl.innerText = data.verdict;
                vEl.className = `text-center text-xl font-bold p-3 border verdict-${data.verdict}`;

                if (data.metrics) {
                    document.getElementById('res-cos').innerText = data.metrics.cosine.toFixed(4);
                    document.getElementById('res-fourier').innerText = data.metrics.fourier.toFixed(4);
                    document.getElementById('res-shazam').innerText = data.metrics.shazam.toFixed(4);
                    document.getElementById('res-ssim').innerText = data.metrics.ssim.toFixed(4);
                    document.getElementById('res-color').innerText = data.metrics.color.toFixed(4) + ` (ΔH=${data.metrics.hue_diff.toFixed(0)}°)`;
                    log(`AGF Score: ${data.agf_score.toFixed(4)}`);
                } else {
                    // Si es un BLOCKED directo del servidor (ej. fallo de crash o cara no detectada)
                    document.getElementById('res-cos').innerText = "-";
                    document.getElementById('res-fourier').innerText = "-";
                    document.getElementById('res-shazam').innerText = "-";
                    document.getElementById('res-ssim').innerText = "-";
                    document.getElementById('res-color').innerText = "-";
                    log(`Motivo: ${data.reason || 'No verificable'}`);
                }

                log(`Veredicto: ${data.verdict}`);

                // 5. Mostrar el JSON REAL generado por Termux
                document.getElementById('json-box').innerText = JSON.stringify(data, null, 2);
                lastResult = data;

            } catch (error) {
                log(`❌ ERROR DE CONEXIÓN: ${error.message}`);
                log("Asegúrate de que el servidor Flask esté corriendo en Termux.");
                const vEl = document.getElementById('res-verdict');
                vEl.innerText = "ERROR DE RED";
                vEl.className = "text-center text-xl font-bold p-3 border verdict-BLOCKED";
            } finally {
                btn.disabled = false; btn.innerText = "▶ AUDITORÍA FORENSE (REAL)";
            }
        }

        window.onload = initDragResize;
    </script>
</body>
</html>
