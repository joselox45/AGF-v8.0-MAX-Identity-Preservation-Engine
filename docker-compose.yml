version: '3.8'

services:
  agf-engine:
    build: .
    container_name: agf-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./arcface.onnx:/app/arcface.onnx:ro
      - ./blaze_face_full_range.tflite:/app/blaze_face_full_range.tflite:ro
      - ./evidence:/app/evidence
      - ./termux_sealed:/app/termux_sealed
    environment:
      - AGF_MODE=production
      - AGF_LOG_LEVEL=INFO
    depends_on:
      - minio
    networks:
      - agf-net

  minio:
    image: minio/minio:latest
    container_name: agf-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ***REDACTED***
      MINIO_ROOT_PASSWORD: ***REDACTED***
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - agf-net

  prometheus:
    image: prom/prometheus:latest
    container_name: agf-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - agf-net

  grafana:
    image: grafana/grafana:latest
    container_name: agf-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ***REDACTED***
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - agf-net

volumes:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  agf-net:
    driver: bridge
